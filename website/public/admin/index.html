<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>UKPSC Decoded — Content Manager</title>
    <link rel="icon" href="data:," />
    <!--
      Tell Decap CMS exactly where config.yml lives.

      Without this, Decap resolves "config.yml" relative to the page URL. This
      site is served at /admin (no trailing slash), so the relative lookup
      becomes /config.yml -> 404 -> "Error loading the CMS configuration".
      An absolute href makes the lookup correct regardless of trailing slash.
    -->
    <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml" />
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      #nc-root { min-height: 100vh; }
      .loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #1a1a1f;
        color: #fff;
        font-family: system-ui, sans-serif;
      }
      .loading-screen h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      .loading-screen p { color: #91919f; margin: 0; font-size: 0.9rem; }
      .spinner {
        width: 32px; height: 32px;
        border: 3px solid #3d3d46;
        border-top-color: #f59307;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 1.5rem;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="nc-root">
      <div class="loading-screen">
        <div class="spinner"></div>
        <h1>UKPSC Decoded</h1>
        <p>Loading Content Manager&hellip;</p>
      </div>
    </div>
    <!-- Pinned to an exact version so a CDN release can never change what loads here. -->
    <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
  </body>
</html>
