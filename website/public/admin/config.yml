backend:
  name: github
  repo: joshibhanu2018-design/Ukpscdecoded
  branch: main
  base_url: https://ukpscdecoded.vercel.app
  auth_endpoint: api/auth

# Uncomment while running `npx decap-server` for local editing without OAuth:
# local_backend: true

publish_mode: simple
media_folder: "website/public/uploads"
public_folder: "/uploads"

site_url: https://ukpscdecoded.vercel.app
display_url: https://ukpscdecoded.vercel.app

collections:
  # ============================================
  # HOME PAGE
  # ============================================
  - name: "home"
    label: "🏠 Home Page"
    files:
      - name: "home"
        label: "Home Page Content"
        file: "website/content/home.json"
        description: "Edit the hero section, stats, features, book preview and testimonials on your homepage."
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Heading — Line 1", name: "headingLine1", widget: "string" }
              - { label: "Heading — Line 2 (saffron highlight)", name: "headingLine2", widget: "string", hint: "This part appears in saffron/orange colour" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Primary Button Text", name: "primaryButtonText", widget: "string" }
              - { label: "Primary Button Link", name: "primaryButtonLink", widget: "string" }
              - { label: "Secondary Button Text", name: "secondaryButtonText", widget: "string" }
              - { label: "Secondary Button Link", name: "secondaryButtonLink", widget: "string" }

          - label: "Stats Bar"
            name: "stats"
            widget: "list"
            summary: "{{fields.value}} — {{fields.label}}"
            fields:
              - { label: "Value", name: "value", widget: "string", hint: "e.g. 2000+" }
              - { label: "Label", name: "label", widget: "string", hint: "e.g. YouTube Subscribers" }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options: ["video", "users", "book", "award"]

          - label: "Features Section"
            name: "features"
            widget: "object"
            fields:
              - { label: "Heading — Line 1", name: "headingLine1", widget: "string" }
              - { label: "Heading — Line 2 (jade highlight)", name: "headingLine2", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - label: "Feature Cards"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - label: "Icon"
                    name: "icon"
                    widget: "select"
                    options: ["play", "newspaper", "chart", "book", "brain", "message"]

          - label: "Book Preview Section"
            name: "bookPreview"
            widget: "object"
            fields:
              - { label: "Badge Text", name: "badge", widget: "string" }
              - { label: "Heading — Line 1", name: "headingLine1", widget: "string" }
              - { label: "Heading — Line 2 (saffron highlight)", name: "headingLine2", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Table of Contents Heading", name: "tocHeading", widget: "string" }
              - label: "Chapter Highlights"
                name: "chapters"
                widget: "list"
                hint: "Shown as a numbered list"
              - { label: "'More chapters' Note", name: "moreChaptersNote", widget: "string" }
              - { label: "Button Text", name: "buttonText", widget: "string" }
              - { label: "Book Cover — Title", name: "coverTitle", widget: "string" }
              - { label: "Book Cover — Subtitle", name: "coverSubtitle", widget: "string" }
              - { label: "Book Cover — Footer Text", name: "coverFooter", widget: "string" }

          - label: "Testimonials Section"
            name: "testimonials"
            widget: "object"
            fields:
              - { label: "Heading — Line 1", name: "headingLine1", widget: "string" }
              - { label: "Heading — Line 2 (jade highlight)", name: "headingLine2", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - label: "Testimonial Cards"
                name: "items"
                widget: "list"
                summary: "{{fields.name}} — {{fields.exam}}"
                fields:
                  - { label: "Student Name", name: "name", widget: "string" }
                  - { label: "Exam & Year", name: "exam", widget: "string", hint: "e.g. UKPSC PCS 2024" }
                  - { label: "Testimonial Text", name: "text", widget: "text" }
                  - { label: "Star Rating", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, default: 5 }

          - label: "Final CTA Section"
            name: "finalCta"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Telegram Button Text", name: "telegramText", widget: "string" }
              - { label: "Telegram Link", name: "telegramLink", widget: "string" }
              - { label: "YouTube Button Text", name: "youtubeText", widget: "string" }
              - { label: "YouTube Link", name: "youtubeLink", widget: "string" }

  # ============================================
  # BOOK DETAILS
  # ============================================
  - name: "book"
    label: "📕 Book Details"
    files:
      - name: "book"
        label: "Buy Book Page Content"
        file: "website/content/book.json"
        description: "Edit book title, price, chapter list, what's included and trust badges."
        fields:
          - { label: "Book Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - { label: "Short Description", name: "description", widget: "text" }
          - { label: "Selling Price (₹)", name: "price", widget: "number", value_type: "int" }
          - { label: "Original Price (₹, struck-through)", name: "originalPrice", widget: "number", value_type: "int" }
          - { label: "Shipping Note", name: "shippingNote", widget: "string" }
          - { label: "WhatsApp Number", name: "whatsappNumber", widget: "string", hint: "With country code, digits only. e.g. 919876543210" }

          - label: "Early-Bird Offer Banner"
            name: "earlyBird"
            widget: "object"
            fields:
              - { label: "Show Banner", name: "enabled", widget: "boolean", default: true }
              - { label: "Badge Text", name: "badge", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Subtext", name: "subtext", widget: "string" }
              - { label: "Offer Ends (deadline)", name: "deadline", widget: "datetime", hint: "Countdown counts down to this date/time" }
              - { label: "Stock Note", name: "stockNote", widget: "string", required: false }

          - { label: "Free Sample — Section Heading", name: "previewHeading", widget: "string" }
          - { label: "Free Sample — Subtext", name: "previewSubtext", widget: "text" }
          - label: "Free Sample Pages"
            name: "freePreviews"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "Paste one real page of content per sample to show free before purchase."
            fields:
              - { label: "Label", name: "label", widget: "string", hint: "e.g. Chapter 1 — History" }
              - { label: "Sample Title", name: "title", widget: "string" }
              - { label: "Page Content", name: "content", widget: "text" }

          - { label: "'What's Included' Heading", name: "includedHeading", widget: "string" }
          - label: "What's Included Items"
            name: "included"
            widget: "list"
            summary: "{{fields.text}}"
            fields:
              - { label: "Item", name: "text", widget: "string" }

          - { label: "Chapters Section Heading", name: "chaptersHeading", widget: "string" }
          - { label: "Chapters Note", name: "chaptersNote", widget: "text", required: false, hint: "Shown under the chapters heading — e.g. explains that video lectures are coming." }
          - label: "Chapter Parts"
            name: "chapters"
            widget: "list"
            summary: "{{fields.part}}"
            fields:
              - { label: "Part Name", name: "part", widget: "string", hint: "e.g. Part A — History" }
              - label: "Chapters in this Part"
                name: "items"
                widget: "list"
                summary: "{{fields.number}}. {{fields.title}}"
                fields:
                  - { label: "Chapter Number", name: "number", widget: "number", value_type: "int", required: false }
                  - { label: "Chapter Title", name: "title", widget: "string" }
                  - { label: "Video Lecture URL", name: "videoUrl", widget: "string", required: false, hint: "Paste the YouTube link once this chapter's video is ready. Leave blank to show 'Video coming soon'." }

          - label: "Trust Badges"
            name: "trustBadges"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options: ["truck", "banknote", "return"]

  # ============================================
  # COURSES
  # ============================================
  - name: "courses"
    label: "🎓 Courses"
    files:
      - name: "courses"
        label: "Courses Page Content"
        file: "website/content/courses.json"
        description: "Edit course names, prices, descriptions and features. Toggle 'Launching Soon' per course."
        fields:
          - { label: "Page Heading", name: "heading", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "text" }

          - label: "Course Cards"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} — ₹{{fields.price}}"
            fields:
              - { label: "Course Title", name: "title", widget: "string" }
              - { label: "Duration", name: "duration", widget: "string", hint: "e.g. 6 months" }
              - { label: "Price (₹)", name: "price", widget: "number", value_type: "int" }
              - { label: "Original Price (₹)", name: "originalPrice", widget: "number", value_type: "int" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Show 'Launching Soon' badge", name: "launchingSoon", widget: "boolean", default: true }
              - { label: "Badge Text", name: "badge", widget: "string", required: false }
              - label: "Accent Colour"
                name: "color"
                widget: "select"
                options: ["saffron", "jade", "graphite"]
              - label: "Features"
                name: "features"
                widget: "list"
                summary: "{{fields.text}}"
                fields:
                  - { label: "Feature", name: "text", widget: "string" }

          - label: "Email Capture Section"
            name: "emailCapture"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Button Text", name: "buttonText", widget: "string" }
              - { label: "Success Message", name: "successMessage", widget: "string" }

          - label: "Free Content CTA"
            name: "freeCta"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Button Text", name: "buttonText", widget: "string" }

  # ============================================
  # ABOUT / CONTACT
  # ============================================
  - name: "about"
    label: "👤 About & Contact"
    files:
      - name: "about"
        label: "About / Contact Page Content"
        file: "website/content/about.json"
        description: "Edit mission statement, stats, journey timeline and all contact details."
        fields:
          - { label: "Page Heading", name: "heading", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "text" }

          - label: "Mission Section"
            name: "mission"
            widget: "object"
            fields:
              - { label: "Section Heading", name: "heading", widget: "string" }
              - { label: "Mission Quote", name: "quote", widget: "text", hint: "Shown as a large italic quote" }
              - { label: "Supporting Paragraph", name: "body", widget: "text" }

          - { label: "Stats Section Heading", name: "statsHeading", widget: "string" }
          - label: "Impact Stats"
            name: "stats"
            widget: "list"
            summary: "{{fields.value}} — {{fields.label}}"
            fields:
              - { label: "Value", name: "value", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options: ["video", "send", "book", "award"]

          - { label: "Timeline Section Heading", name: "timelineHeading", widget: "string" }
          - label: "Journey Timeline"
            name: "timeline"
            widget: "list"
            summary: "{{fields.year}} — {{fields.title}}"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Milestone Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options: ["video", "send", "book", "rocket"]

          - label: "Contact Section"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Section Heading", name: "heading", widget: "string" }
              - { label: "'Connect With Us' Heading", name: "connectHeading", widget: "string" }
              - { label: "'Send a Message' Heading", name: "formHeading", widget: "string" }
              - { label: "Email Address", name: "email", widget: "string" }
              - { label: "YouTube URL", name: "youtube", widget: "string" }
              - { label: "YouTube Handle", name: "youtubeHandle", widget: "string" }
              - { label: "Telegram URL", name: "telegram", widget: "string" }
              - { label: "Telegram Handle", name: "telegramHandle", widget: "string" }
              - { label: "Instagram URL", name: "instagram", widget: "string" }
              - { label: "Instagram Handle", name: "instagramHandle", widget: "string" }
              - { label: "Form Success Heading", name: "successHeading", widget: "string" }
              - { label: "Form Success Message", name: "successMessage", widget: "text" }

  # ============================================
  # DAILY QUIZ
  # ============================================
  - name: "quiz"
    label: "❓ Daily Quiz"
    files:
      - name: "quiz"
        label: "Homepage Quiz Questions"
        file: "website/content/quiz.json"
        description: "Edit the 5 homepage quiz questions. Update these regularly (e.g. from your PYQ PDF)."
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Subheading", name: "subheading", widget: "text" }
          - label: "Questions"
            name: "questions"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - label: "Options"
                name: "options"
                widget: "list"
                hint: "Add exactly 4 options"
              - { label: "Correct Option Index (0-3)", name: "correctIndex", widget: "number", value_type: "int", min: 0, max: 3 }
              - { label: "Explanation", name: "explanation", widget: "text" }
              - { label: "% Who Got It Right", name: "solvedPct", widget: "number", value_type: "int", min: 0, max: 100, hint: "Social-proof stat shown to users" }

  # ============================================
  # LEAD MAGNET POPUP
  # ============================================
  - name: "leadMagnet"
    label: "🎁 Lead Popup"
    files:
      - name: "leadMagnet"
        label: "Free Guidebook Popup"
        file: "website/content/leadMagnet.json"
        description: "The popup that offers a free download to capture leads. Fill Form Endpoint + PDF URL to go live."
        fields:
          - { label: "Enable Popup", name: "enabled", widget: "boolean", default: true }
          - { label: "Badge", name: "badge", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "text" }
          - label: "Benefit Bullets"
            name: "benefits"
            widget: "list"
          - { label: "Button Text", name: "buttonText", widget: "string" }
          - { label: "Name Placeholder", name: "namePlaceholder", widget: "string" }
          - { label: "Phone Placeholder", name: "phonePlaceholder", widget: "string" }
          - { label: "Email Placeholder", name: "emailPlaceholder", widget: "string" }
          - { label: "Form Endpoint URL", name: "formEndpoint", widget: "string", required: false, hint: "Google Apps Script / Form webhook that saves leads to your spreadsheet" }
          - { label: "Free PDF Download URL", name: "pdfUrl", widget: "string", required: false, hint: "Link to the free guidebook PDF" }
          - { label: "Telegram Link", name: "telegramLink", widget: "string" }
          - { label: "Success Heading", name: "successHeading", widget: "string" }
          - { label: "Success Message", name: "successMessage", widget: "text" }
          - { label: "Delay (seconds)", name: "delaySeconds", widget: "number", value_type: "int", default: 25 }

  # ============================================
  # WEEKLY CURRENT AFFAIRS
  # ============================================
  - name: "currentAffairs"
    label: "🗞️ Weekly Current Affairs"
    files:
      - name: "currentAffairs"
        label: "Weekly Current Affairs"
        file: "website/content/currentAffairs.json"
        description: "Add a new week each Sunday. The week with the latest 'Publish Date' automatically appears on top. Add each headline with short context and a source."
        fields:
          - { label: "Page Heading", name: "heading", widget: "string" }
          - { label: "Page Subheading", name: "subheading", widget: "text" }
          - label: "Weeks"
            name: "weeks"
            widget: "list"
            summary: "{{fields.label}}"
            hint: "Each entry is one week's gist. Newest week (by Publish Date) shows first."
            fields:
              - { label: "ID (unique)", name: "id", widget: "string", hint: "e.g. 2026-08-week1 — must be unique" }
              - { label: "Week Label", name: "label", widget: "string", hint: "e.g. August 2026 — Week 1" }
              - { label: "Gist Note", name: "gistNote", widget: "string", required: false, default: "Weekly Gist · Sunday" }
              - { label: "Publish Date", name: "publishDate", widget: "date", hint: "Used to sort weeks — latest on top. Use the Sunday it goes live." }
              - label: "Headlines"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - label: "Category"
                    name: "category"
                    widget: "select"
                    options: ["Uttarakhand", "National", "International"]
                  - { label: "Headline", name: "title", widget: "string" }
                  - { label: "Context / Analysis", name: "context", widget: "text", required: false, hint: "1–2 lines of context or why it matters for the exam." }
                  - { label: "Source", name: "source", widget: "string", required: false, hint: "e.g. Tribune India — 13 Jul 2026" }

  # ============================================
  # FREE RESOURCES (PDFs / Guides)
  # ============================================
  - name: "freeResources"
    label: "📂 Free Resources"
    files:
      - name: "freeResources"
        label: "Free Resources (PDFs & Guides)"
        file: "website/content/freeResources.json"
        description: "Downloadable PDFs, trackers and guides shown on the Free Content page under the 'Free Resources' tab."
        fields:
          - { label: "Section Heading", name: "heading", widget: "string" }
          - { label: "Section Subheading", name: "subheading", widget: "text" }
          - label: "Resources"
            name: "resources"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Type Label", name: "type", widget: "string", hint: "e.g. PDF, Sheet, Guide" }
              - { label: "URL", name: "url", widget: "string", hint: "Google Drive / Docs link" }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options: ["book", "chart", "newspaper", "brain"]
                required: false
          - label: "Playlists"
            name: "playlists"
            widget: "list"
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "URL", name: "url", widget: "string", hint: "YouTube playlist link" }

  # ============================================
  # SITE SETTINGS
  # ============================================
  - name: "settings"
    label: "⚙️ Site Settings"
    files:
      - name: "settings"
        label: "Global Settings"
        file: "website/content/settings.json"
        description: "Brand name, footer text, exam list and social links used across the whole site."
        fields:
          - { label: "Brand Name — Part 1", name: "brandName1", widget: "string", hint: "e.g. UKPSC (shown in white)" }
          - { label: "Brand Name — Part 2", name: "brandName2", widget: "string", hint: "e.g. Decoded (shown in saffron)" }
          - { label: "Navbar CTA Button Text", name: "navCtaText", widget: "string" }

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "About Text", name: "aboutText", widget: "text" }
              - { label: "Contact Email", name: "email", widget: "string" }
              - label: "Exams Covered List"
                name: "exams"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Exam Name", name: "name", widget: "string" }

          - label: "Social Links"
            name: "social"
            widget: "object"
            fields:
              - { label: "YouTube URL", name: "youtube", widget: "string" }
              - { label: "Telegram URL", name: "telegram", widget: "string" }
              - { label: "Instagram URL", name: "instagram", widget: "string" }

  # ============================================
  # ARTICLES
  # ============================================
  - name: "articles"
    label: "📝 Articles"
    folder: "website/content/articles"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} — {{category}}"
    sortable_fields: ["title", "category", "date"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", hint: "URL-friendly identifier, e.g. ukpsc-2026-complete-strategy" }
      - { label: "Meta Description", name: "meta_description", widget: "text", hint: "SEO description (150-160 characters ideal)" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Strategy"
          - "Answer Writing"
          - "Book List"
          - "PYQ Analysis"
          - "Current Affairs"
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "featured_image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
